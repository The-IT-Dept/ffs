---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: alerttargets.ffs.theitdept.au
spec:
  group: ffs.theitdept.au
  names:
    categories:
    - ffs
    kind: AlertTarget
    listKind: AlertTargetList
    plural: alerttargets
    singular: alerttarget
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.paused
      name: Paused
      type: boolean
    - jsonPath: .status.lastDelivery
      name: Last Delivery
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AlertTarget is a destination for alerts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlertTargetSpec defines where and when alerts are delivered.
            properties:
              allowPrivate:
                default: false
                description: AllowPrivate permits delivery to private network addresses.
                type: boolean
              digest:
                default: {}
                description: Digest configures the scheduled digest.
                properties:
                  includeResolved:
                    default: true
                    description: IncludeResolved includes recently resolved findings
                      in the digest.
                    type: boolean
                  minPriority:
                    default: medium
                    description: MinPriority is the lowest priority included in the
                      digest.
                    enum:
                    - urgent
                    - high
                    - medium
                    - low
                    type: string
                  schedule:
                    default: 0 9 * * *
                    description: Schedule is a cron expression.
                    type: string
                  timeZone:
                    default: UTC
                    description: TimeZone is the IANA time zone the schedule runs
                      in.
                    type: string
                type: object
              immediate:
                default: {}
                description: Immediate configures immediate alerts.
                properties:
                  minPriority:
                    default: urgent
                    description: MinPriority is the lowest priority that triggers
                      an immediate alert.
                    enum:
                    - urgent
                    - high
                    - medium
                    - low
                    type: string
                type: object
              namespaceSelector:
                description: NamespaceSelector limits alerts to namespaces matching
                  these labels.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              namespaces:
                description: Namespaces limits alerts to these namespaces.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              notifyOnFeedStale:
                default: false
                description: NotifyOnFeedStale sends an alert when vulnerability data
                  goes stale.
                type: boolean
              paused:
                default: false
                description: Paused stops all deliveries to this target.
                type: boolean
              quietHours:
                description: QuietHours suppresses alerts during the given intervals.
                properties:
                  allowUrgent:
                    default: true
                    description: AllowUrgent lets urgent alerts through during quiet
                      hours.
                    type: boolean
                  intervals:
                    description: Intervals lists the quiet intervals.
                    items:
                      description: |-
                        TimeInterval follows Alertmanager time_interval semantics: weekdays such as
                        "monday:friday", daysOfMonth such as "1:5" or "-1", months such as
                        "january:march" or "1:3", and years such as "2026:2027".
                      properties:
                        daysOfMonth:
                          description: DaysOfMonth lists days of the month or ranges.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        location:
                          default: UTC
                          description: Location is the IANA time zone for the interval.
                          type: string
                        months:
                          description: Months lists months or month ranges.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        times:
                          description: Times lists times of day.
                          items:
                            description: TimeRange is a range of times within a day,
                              as HH:MM.
                            properties:
                              endTime:
                                description: EndTime is the end of the range.
                                pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
                                type: string
                              startTime:
                                description: StartTime is the start of the range.
                                pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
                                type: string
                            required:
                            - endTime
                            - startTime
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        weekdays:
                          description: Weekdays lists weekdays or weekday ranges.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                        years:
                          description: Years lists years or year ranges.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - intervals
                type: object
              secretRef:
                description: SecretRef references the Secret holding the destination
                  URL.
                properties:
                  name:
                    description: Name is the Secret name in the ffs namespace.
                    minLength: 1
                    type: string
                  signingSecretKey:
                    default: signingSecret
                    description: SigningSecretKey is the Secret key holding the signing
                      secret (webhook only).
                    type: string
                  urlKey:
                    default: url
                    description: URLKey is the Secret key holding the destination
                      URL.
                    type: string
                required:
                - name
                type: object
              type:
                description: Type is the kind of destination.
                enum:
                - slack
                - discord
                - teams
                - webhook
                type: string
            required:
            - secretRef
            - type
            type: object
          status:
            description: AlertTargetStatus is the observed state of an alert target.
            properties:
              conditions:
                description: Conditions describe the target state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastDelivery:
                description: LastDelivery is when an alert was last delivered.
                format: date-time
                type: string
              lastError:
                description: LastError is the most recent delivery error.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation processed.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
