---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: exceptions.ffs.theitdept.au
spec:
  group: ffs.theitdept.au
  names:
    categories:
    - ffs
    kind: Exception
    listKind: ExceptionList
    plural: exceptions
    singular: exception
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.expires
      name: Expires
      type: string
    - jsonPath: .status.matchedFindings
      name: Matched
      type: integer
    - jsonPath: .status.expired
      name: Expired
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Exception excludes matching findings from alerting.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExceptionSpec defines which findings are excepted and why.
            properties:
              advisories:
                description: Advisories lists advisory IDs or aliases.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              expires:
                description: Expires is when the exception stops applying (RFC 3339).
                format: date-time
                type: string
              imageRepositories:
                description: ImageRepositories lists path.Match globs over normalised
                  image repositories.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              justification:
                description: Justification is the VEX justification.
                enum:
                - component_not_present
                - vulnerable_code_not_present
                - vulnerable_code_not_in_execute_path
                - vulnerable_code_cannot_be_controlled_by_adversary
                - inline_mitigations_already_exist
                type: string
              owners:
                description: Owners lists workload names, or Kind/name.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              packages:
                description: Packages lists package names.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              reason:
                description: Reason explains why the exception exists.
                minLength: 1
                type: string
              vexStatus:
                description: VEXStatus is the VEX status to record for excepted findings.
                enum:
                - not_affected
                - affected
                - fixed
                - under_investigation
                type: string
            required:
            - expires
            - reason
            type: object
            x-kubernetes-validations:
            - message: at least one of advisories, packages, imageRepositories or
                owners is required
              rule: has(self.advisories) || has(self.packages) || has(self.imageRepositories)
                || has(self.owners)
          status:
            description: ExceptionStatus is the observed state of an exception.
            properties:
              conditions:
                description: Conditions describe the exception state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expired:
                description: Expired is true once the exception has expired.
                type: boolean
              matchedFindings:
                description: MatchedFindings is the number of findings the exception
                  matches.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the last generation processed.
                format: int64
                type: integer
              urgentNotExcepted:
                description: UrgentNotExcepted is the number of matching urgent findings
                  that are not excepted.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
