{{define "content"}}
<table>
<thead><tr><th>Image</th><th>Platform</th><th>Status</th><th>Used by</th></tr></thead>
<tbody>
{{range .}}<tr>
<td><a href="/images/{{imagePath .ID}}">{{.Repo}}</a><div class="sub">{{.ID}}</div></td>
<td>{{.Platform}}</td>
<td>{{statusLabel .Status}}{{if .StatusReason}}: {{.StatusReason}}{{end}}{{if .PartialCoverage}} <span class="tag">Partial coverage</span>{{end}}</td>
<td>{{range .Owners}}<div><a href="/owners/{{keyPath .}}">{{keyLabel .}}</a></div>{{end}}</td>
</tr>{{end}}
</tbody>
</table>
{{end}}
