{{define "content"}}
<table>
<tbody>
<tr><th>Operating system</th><td>{{.OSImage}}{{if .OSEOL}}<div class="note">{{.OSEOL.Text}}</div>{{end}}</td></tr>
<tr><th>Kernel</th><td>{{.KernelVersion}}</td></tr>
<tr><th>Kubelet</th><td>{{.KubeletVersion}}</td></tr>
<tr><th>Container runtime</th><td>{{.ContainerRuntimeVersion}}</td></tr>
<tr><th>Architecture</th><td>{{.Arch}}</td></tr>
<tr><th>Ready</th><td>{{if .Ready}}Yes{{else}}No{{end}}</td></tr>
<tr><th>Updated</th><td>{{date .UpdatedAt}}</td></tr>
</tbody>
</table>
{{end}}
