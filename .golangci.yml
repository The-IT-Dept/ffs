version: "2"
run:
  # The end-to-end suite (test/e2e) and the memory harness (hack/memharness) build only with their tags; lint them
  # with everything else.
  build-tags:
    - e2e
    - memharness
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G115
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/the-it-dept/ffs
