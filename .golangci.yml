version: "2"
run:
  # The end-to-end suite (test/e2e) builds only with the e2e tag; lint it with everything else.
  build-tags:
    - e2e
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G115
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/the-it-dept/ffs
