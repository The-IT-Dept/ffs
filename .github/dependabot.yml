version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      k8s:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      anchore:
        patterns: ["github.com/anchore/*"]
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Node is bumped by hand, with ui/.nvmrc and the engines field of ui/package.json
      # (TestShipping_NodeVersionPinnedConsistently).
      - dependency-name: node
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ui:
        patterns: ["*"]
