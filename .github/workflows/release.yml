name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: Compute version, short SHA and source date
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHORT="$(git rev-parse --short=7 HEAD)"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          {
            echo "VERSION=${VERSION}"
            echo "SHORT=${SHORT}"
            echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"
          } >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push the multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/the-it-dept/ffs:${{ env.VERSION }}
            ghcr.io/the-it-dept/ffs:sha-${{ env.SHORT }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ env.SHORT }}
          annotations: |
            index:org.opencontainers.image.version=${{ env.VERSION }}
            index:org.opencontainers.image.source=https://github.com/The-IT-Dept/ffs
          outputs: type=registry,rewrite-timestamp=true
          # No buildx in-index attestations: they add unknown/unknown entries to the index.
          # Signatures, SBOMs and provenance come from cosign and GitHub attestations below.
          provenance: false
          sbom: false
          no-cache: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the index and every platform manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "ghcr.io/the-it-dept/ffs@${DIGEST}"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.57.2
      - name: Attest an SPDX SBOM on every platform manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          manifests="$(docker buildx imagetools inspect --raw "ghcr.io/the-it-dept/ffs@${DIGEST}" \
            | jq -r '.manifests[] | "\(.platform.os)-\(.platform.architecture) \(.digest)"')"
          test -n "${manifests}"
          if grep -q unknown <<<"${manifests}"; then
            echo "unexpected attestation manifest in the index: ${manifests}" >&2
            exit 1
          fi
          while read -r PLAT PD; do
            syft scan "registry:ghcr.io/the-it-dept/ffs@${PD}" -o "spdx-json=sbom-${PLAT}.spdx.json"
            cosign attest --yes --type spdxjson --predicate "sbom-${PLAT}.spdx.json" "ghcr.io/the-it-dept/ffs@${PD}"
          done <<<"${manifests}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/the-it-dept/ffs
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records need artifact-metadata: write; they are not used.
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sbom-*.spdx.json
          if-no-files-found: error

  chart:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.image.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # cosign and the provenance push read registry credentials from the docker config.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the image digest in the chart
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          yq -i '.image.digest = strenv(DIGEST)' charts/ffs/values.yaml
      - name: Package the chart
        run: helm package charts/ffs --version "${VERSION}" --app-version "${VERSION}" -d dist
      - id: push
        name: Push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/ffs-${VERSION}.tgz" oci://ghcr.io/the-it-dept/charts 2>&1 | tee push.log
          CHART_DIGEST="$(sed -n 's/^Digest: //p' push.log)"
          if [[ -z "${CHART_DIGEST}" ]]; then
            echo "helm push printed no digest" >&2
            exit 1
          fi
          echo "digest=${CHART_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Sign the chart
        env:
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/the-it-dept/charts/ffs@${CHART_DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/the-it-dept/charts/ffs
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  release:
    needs: [image, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.image.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sboms
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart
          path: dist
      - name: Write the release notes
        run: |
          set -euo pipefail
          {
            echo "Image: \`ghcr.io/the-it-dept/ffs@${DIGEST}\`"
            echo
            echo "Chart: \`oci://ghcr.io/the-it-dept/charts/ffs --version ${VERSION}\`"
            echo
            echo "## Verify"
            echo
            echo '```sh'
            echo "TAG=${GITHUB_REF_NAME} V=${VERSION}"
            echo "D=${DIGEST}"
            echo "CD=${CHART_DIGEST}"
            cat <<'EOF'
          ID="https://github.com/The-IT-Dept/ffs/.github/workflows/release.yml@refs/tags/$TAG"
          ISS=https://token.actions.githubusercontent.com
          cosign verify ghcr.io/the-it-dept/ffs@$D --certificate-identity "$ID" --certificate-oidc-issuer $ISS
          for pd in $(crane manifest ghcr.io/the-it-dept/ffs@$D | jq -r '.manifests[].digest'); do
            cosign verify ghcr.io/the-it-dept/ffs@$pd --certificate-identity "$ID" --certificate-oidc-issuer $ISS
            cosign verify-attestation --type spdxjson ghcr.io/the-it-dept/ffs@$pd --certificate-identity "$ID" --certificate-oidc-issuer $ISS
          done
          gh attestation verify oci://ghcr.io/the-it-dept/ffs@$D -R The-IT-Dept/ffs --signer-workflow The-IT-Dept/ffs/.github/workflows/release.yml
          cosign verify ghcr.io/the-it-dept/charts/ffs@$CD --certificate-identity "$ID" --certificate-oidc-issuer $ISS
          gh attestation verify oci://ghcr.io/the-it-dept/charts/ffs@$CD -R The-IT-Dept/ffs
          test "$(helm show values oci://ghcr.io/the-it-dept/charts/ffs --version $V | yq .image.digest)" = "$D" && echo pinned
          EOF
            echo '```'
          } > notes.md
      - name: Create the release with its assets, then publish it
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "ffs $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes "${prerelease[@]}" \
            dist/*.tgz sbom-*.spdx.json
          # Assets go up before publishing: an immutable release cannot take assets afterwards.
          gh release edit "$GITHUB_REF_NAME" --draft=false
