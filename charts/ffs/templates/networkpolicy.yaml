{{- /*
The ffs pod's NetworkPolicy. It is created while networkPolicy.enabled is true (see ffs.networkPolicy for the
deprecated nodeAgent.networkPolicy.enabled), whether or not the node agent runs, so web.networkPolicy.from is in
force either way; the agent API rule is added only with the agent.
*/ -}}
{{- $webFrom := .Values.web.networkPolicy.from | default list }}
{{- if include "ffs.networkPolicy" . }}
{{- if and .Values.web.service.enabled (not $webFrom) (not (include "ffs.listenLoopback" .)) }}
{{- fail "web.service.enabled needs web.networkPolicy.from: the NetworkPolicy of networkPolicy.enabled admits the web UI port only from the peers listed there, such as your authenticating proxy's pods. Set web.networkPolicy.from, or set networkPolicy.enabled=false and restrict the port with your own NetworkPolicy" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ffs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ffs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ffs.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if .Values.nodeAgent.enabled }}
    # The agent API, from the agent pods only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "ffs.agentNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ffs-agent
      ports:
        - {protocol: TCP, port: agent-api}
    {{- end }}
    # Metrics and health stay open to every source: metrics answers only requests that pass a
    # TokenReview and a SubjectAccessReview, and health serves only the kubelet's probes.
    - ports:
        - {protocol: TCP, port: metrics}
        - {protocol: TCP, port: health}
    {{- if and $webFrom (not (include "ffs.listenLoopback" .)) }}
    # The web UI and API have no authentication: only the peers in web.networkPolicy.from reach them.
    - from:
        {{- toYaml $webFrom | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ include "ffs.httpPort" . }}}
    {{- end }}
{{- else if $webFrom }}
{{- $key := ternary "nodeAgent.networkPolicy.enabled" "networkPolicy.enabled" (include "ffs.legacyNetworkPolicy" . | empty | not) }}
{{- fail (printf "web.networkPolicy.from takes effect only through the NetworkPolicy of networkPolicy.enabled, which %s=false turns off: no NetworkPolicy of the chart selects the ffs pod. Restrict the web UI port with your own NetworkPolicy and unset web.networkPolicy.from, or set networkPolicy.enabled=true" $key) }}
{{- end }}
