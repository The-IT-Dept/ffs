{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ffs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ffs.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/prometheusrules.yaml" | nindent 2 }}
  {{- if .Values.nodeAgent.enabled }}
  {{- .Files.Get "files/prometheusrules-agent.yaml" | nindent 4 }}
  {{- end }}
{{- end }}
