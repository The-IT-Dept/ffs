{{- if and .Values.nodeAgent.enabled .Values.nodeAgent.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ffs.fullname" . }}-agent-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ffs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ffs.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The agent API, from the agent pods only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "ffs.agentNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ffs-agent
      ports:
        - {protocol: TCP, port: agent-api}
    # The web UI, metrics and health ports, from anywhere as before.
    - ports:
        - {protocol: TCP, port: http}
        - {protocol: TCP, port: metrics}
        - {protocol: TCP, port: health}
{{- end }}
