{{- if .Values.nodeAgent.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ffs.agentServiceAccount" . }}
  namespace: {{ include "ffs.agentNamespace" . }}
  labels:
    {{- include "ffs.agentLabels" . | nindent 4 }}
# The agent has no Kubernetes API access; its only credential is a projected token for the ffs-agent audience.
automountServiceAccountToken: false
{{- end }}
