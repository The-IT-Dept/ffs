- name: ffs-node-agent
  rules:
    - alert: FFSNodeAgentNotReporting
      expr: sum(ffs_node_agent_nodes{state="stale"}) > 0
      for: 30m
      labels: {severity: warning}
      annotations:
        summary: "ffs node agents have stopped reporting"
        description: "{{ $value }} nodes have stopped reporting to ffs, so their host packages are not checked. Check the agent DaemonSet pods in the agent namespace."
