apiVersion: apps/v1
kind: Deployment
metadata:
  name: sideloaded
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sideloaded
  template:
    metadata:
      labels:
        app: sideloaded
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sideloaded
          image: ${SIDELOADED_IMAGE}
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
